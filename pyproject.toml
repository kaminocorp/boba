[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "boba"
version = "0.2.7"
description = "Agent-native bug bounty hunting framework"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
    "playwright>=1.40",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
]

[project.optional-dependencies]
oob = ["interactsh-py>=0.1"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
boba = "boba.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/boba"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
